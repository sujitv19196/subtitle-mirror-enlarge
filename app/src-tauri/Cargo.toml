[package]
name = "subtitle-mirror"
version = "0.1.1"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.6"
tauri-plugin-dialog = "2.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
