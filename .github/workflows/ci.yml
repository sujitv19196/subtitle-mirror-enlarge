name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun test

  # Branch protection requires a check named "test"; this reports it for the whole matrix.
  test:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.tests.result }}" = "success" ]'
